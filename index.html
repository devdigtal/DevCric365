<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevCric365 - Fastest Cricket Updates</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #121212; color: #ffffff; padding-bottom: 60px; }
        header { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00ffcc; }
        .logo { font-size: 24px; font-weight: bold; color: #00ffcc; text-transform: uppercase; }
        .logo span { color: #ffcc00; }
        .live-badge { background-color: #ff0055; color: white; padding: 6px 12px; border-radius: 4px; font-weight: bold; animation: blinker 1.5s infinite; }
        .container { max-width: 850px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .promo-card { background: linear-gradient(145deg, #1e2a38, #131c26); border: 2px solid #00ffcc; border-radius: 16px; padding: 40px 25px; margin-bottom: 30px; }
        
        /* SCROLLING SLIDER DESIGN */
        .slider-section { background: #1a1a1a; padding: 20px; border-radius: 12px; margin-top: 30px; }
        .slider-container { width: 100%; overflow: hidden; border-radius: 8px; border: 2px solid #444; }
        .slider { display: flex; width: 1000%; animation: scroll 30s linear infinite; }
        .slider img { width: 10%; object-fit: contain; }
        @keyframes scroll {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-90%); }
        }

        .main-btn { display: block; width: 100%; max-width: 400px; margin: 0 auto 25px auto; background: linear-gradient(135deg, #00ffcc, #008b76); color: #121212; font-weight: bold; text-decoration: none; padding: 16px; border-radius: 50px; text-transform: uppercase; }
        .disclaimer-box { background-color: #1a1a1a; border-top: 3px solid #ff0055; padding: 25px; margin-top: 20px; text-align: left; }
        @keyframes blinker { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">DevCric<span>365</span></div>
        <div class="live-badge">🔴 PLATFORM ACTIVE</div>
    </header>

    <div class="container">
        <div class="promo-card">
            <h1>Fastest Live Line & Booking</h1>
            <p>Get the most accurate market sports updates and instant services.</p>
            <a href="https://www.devbet365.com/" class="main-btn">🚀 GO TO DEVBET365 SITE</a>
        </div>

        <!-- SCROLLING SLIDER -->
        <div class="slider-section">
            <h3>Today's Match Schedules</h3>
            <div class="slider-container">
                <div class="slider">
                    <img src="poster1.jpg" alt="P1">
                    <img src="poster2.jpg" alt="P2">
                    <img src="poster3.jpg" alt="P3">
                    <img src="poster4.jpg" alt="P4">
                    <img src="poster5.jpg" alt="P5">
                    <img src="poster6.jpg" alt="P6">
                    <img src="poster7.jpg" alt="P7">
                    <img src="poster8.jpg" alt="P8">
                    <img src="poster9.jpg" alt="P9">
                    <img src="poster10.jpg" alt="P10">
                </div>
            </div>
        </div>

        <div class="disclaimer-box">
            <h4>18+ TERMS & LEGAL DISCLAIMER</h4>
            <p>This platform is for 18+ only. Please play responsibly.</p>
        </div>
    </div>
</body>
</html>
