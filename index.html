<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCric365 - Fastest Cricket Live Line</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding-bottom: 60px;
        }
        header {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-bottom: 2px solid #00ffcc;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .logo span {
            color: #ffcc00;
        }
        .live-badge {
            background-color: #ff0055;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 15px;
        }
        h2 {
            margin-bottom: 20px;
            color: #ffcc00;
            border-left: 4px solid #00ffcc;
            padding-left: 10px;
            font-size: 22px;
            text-transform: uppercase;
        }
        .widget-box {
            width: 100%;
            background: #1e1e1e;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.2);
            margin-bottom: 35px;
        }
        iframe {
            width: 100%;
            height: 520px;
            border: none;
            background: #1e1e1e;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">DevCric<span>365</span></div>
        <div class="live-badge">🔴 LIVE MATCH CENTER</div>
    </header>

    <div class="container">
        <h2>Live Scoreboard</h2>
        
        <div class="widget-box">
            <iframe src="https://m.cricbuzz.com/cricket-match/live-scores" title="Live Cricket Scores"></iframe>
        </div>
    </div>

</body>
</html>
