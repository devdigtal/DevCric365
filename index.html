<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCric365 - Fastest Live Cricket Scores & News</title>
    <style>
        /* Modern & Premium Sports Dark Theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
        }
        header {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border-bottom: 2px solid #00ffcc;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .logo span {
            color: #ffcc00;
        }
        .live-badge {
            background-color: #ff0055;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        h2 {
            margin-bottom: 20px;
            color: #ffcc00;
            border-left: 4px solid #00ffcc;
            padding-left: 10px;
            font-size: 22px;
        }
        /* Scorecard Layout */
        .match-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .match-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .match-card:hover {
            transform: translateY(-5px);
            border-color: #00ffcc;
        }
        .match-status {
            font-size: 12px;
            color: #ffaa00;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }
        .team-name {
            font-size: 16px;
            font-weight: 600;
            color: #eee;
        }
        .team-score {
            font-size: 16px;
            font-weight: bold;
            color: #00ffcc;
        }
        .match-note {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
            font-style: italic;
            border-top: 1px solid #2a2a2a;
            padding-top: 8px;
        }
        /* News Section */
        .news-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .news-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
            transition: border-color 0.3s;
        }
        .news-card:hover {
            border-color: #ffcc00;
        }
        .news-content {
            padding: 18px;
        }
        .news-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffffff;
            line-height: 1.4;
        }
        .news-desc {
            font-size: 14px;
            color: #aaa;
            line-height: 1.5;
        }
        .loading {
            text-align: center;
            color: #aaa;
            padding: 30px;
            grid-column: 1 / -1;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo">DevCric<span>365</span></div>
        <div class="live-badge">🔴 FASTEST LIVE LINE</div>
    </header>

    <div class="container">
        <!-- Live Scores Section -->
        <h2>Live & Upcoming Matches</h2>
        <div class="match-container" id="score-container">
            <div class="loading">Loading live scores automatically...</div>
        </div>

        <!-- News Section -->
        <h2>Latest Cricket Updates</h2>
        <div class="news-container" id="news-container">
            <div class="loading">Loading latest news...</div>
        </div>
    </div>

    <script>
        // Real-time Automatic Data Fetching System
        // Using a reliable public API endpoint for live scorecard testing
        const API_URL = "https://api.cricapi.com/v1/currentMatches?apikey=98104ba0-a42e-4b6a-91ff-eeae1c944111&offset=0";
        
        async function fetchLiveScores() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const scoreContainer = document.getElementById('score-container');
                scoreContainer.innerHTML = ''; // Clear loading text

                if (!data.data || data.data.length === 0) {
                    scoreContainer.innerHTML = '<div class="loading">No active live matches at the moment. Check back during match hours!</div>';
                    return;
                }

                // Loop through available live matches (Max 6)
                data.data.slice(0, 6).forEach(match => {
                    const card = document.createElement('div');
                    card.className = 'match-card';

                    // Safe check for scores data formatting
                    const score1 = match.score && match.score[0] ? ${match.score[0].r}/${match.score[0].w} (${match.score[0].o}) : 'Yet to bat';
                    const score2 = match.score && match.score[1] ? ${match.score[1].r}/${match.score[1].w} (${match.score[1].o}) : 'Yet to bat';

                    card.innerHTML = `
                        <div class="match-status">${match.matchType.toUpperCase()} • ${match.status}</div>
                        <div class="team-row">
                            <span class="team-name">🏏 ${match.teams[0]}</span>
                            <span class="team-score">${score1}</span>
                        </div>
                        <div class="team-row">
                            <span class="team-name">🏏 ${match.teams[1]}</span>
                            <span class="team-score">${score2}</span>
                        </div>
                        <div class="match-note">${match.name}</div>
                    `;
                    scoreContainer.appendChild(card);
                });

            } catch (error) {
                console.error("Error fetching scores:", error);
                document.getElementById('score-container').innerHTML = '<div class="loading" style="color: #ff0055;">Live updates briefly interrupted. Reconnecting automatically...</div>';
            }
        }

        // Automatic Dynamic News Feed (Local Feed optimization)
        function loadNews() {
            const newsContainer = document.getElementById('news-container');
            newsContainer.innerHTML = '';

            const sportsNews = [
                { title: "DevCric365 Tournament Analysis & Trends", desc: "Expert analytics point towards massive fan engagement numbers shifting towards real-time digital live lines this season." },
                { title: "T20 Format Strategy Explored", desc: "Teams are heavily modifying their opening partnerships to capitalize fully on powerplay field restrictions." },
                { title: "Pitch Conditions & Technical Overview", desc: "Upcoming matches are predicted to favour fast chasing sides due to heavy outfield dew factors late evening." }
            ];

            sportsNews.forEach(news => {
                const nCard = document.createElement('div');
                nCard.className = 'news-card';
                nCard.innerHTML = `
                    <div class="news-content">
                        <div class="news-title">${news.title}</div>
                        <div class="news-desc">${news.desc}</div>
                    </div>
                `;
                newsContainer.appendChild(nCard);
            });
        }

        // Initialize immediately
        fetchLiveScores();
        loadNews();

        // Background automatic data sync every 30 seconds
        setInterval(fetchLiveScores, 30000);
    </script>
</body>
</html>
